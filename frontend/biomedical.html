<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biomedical Equipment — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-tools text-dark me-2"></i>Biomedical Equipment & Asset Maintenance</h4>
        <p class="text-muted small mb-0">Equipment registry, preventive maintenance, calibration schedules & breakdown reporting.</p>
      </div>
      <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#newEquipmentModal">
        <i class="bi bi-plus-lg me-1"></i> Register Biomedical Equipment
      </button>
    </div>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="biomedicalSearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshBiomedical">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Inventory
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Biomedical Equipment Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Asset Tag</th>
                <th>Equipment Name & Model</th>
                <th>Assigned Dept</th>
                <th>Last Service</th>
                <th>Calibration Due</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="biomedicalTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Loading biomedical equipment...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Register Equipment Modal -->
  <div class="modal fade" id="newEquipmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title"><i class="bi bi-cpu me-2"></i>Register Biomedical Equipment Asset</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="biomedicalForm">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Equipment Name</label>
                <input type="text" class="form-control" id="bmedName" value="ICU Multipara Patient Monitor" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Model / Serial Number</label>
                <input type="text" class="form-control" id="bmedModel" value="Model-X500 / SN-998823" />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Assigned Department</label>
                <input type="text" class="form-control" id="bmedDept" value="ICU / CCU" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Calibration Due Date</label>
                <input type="date" class="form-control" id="bmedCalibration" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark" id="btnSaveBiomedical">Register Asset</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/biomedical.js"></script>
</body>
</html>
