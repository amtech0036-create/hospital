<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radiology & Imaging — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-x-diamond-fill text-info me-2"></i>Radiology & Imaging Workstation</h4>
        <p class="text-muted small mb-0">X-Ray, CT, MRI & Ultrasound scheduling, radiologist reporting & PDF printing.</p>
      </div>
      <button class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#newRadiologyOrderModal">
        <i class="bi bi-plus-lg me-1"></i> New Imaging Order
      </button>
    </div>

    <!-- Search-First Component container -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="radiologySearchContainer">
            <!-- Search-First component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshRadiology">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Worklist
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Worklist Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Modality</th>
                <th>Patient Name & UHID</th>
                <th>Procedure</th>
                <th>Radiologist</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="radiologyTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Loading radiology worklist...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Radiology Order Modal -->
  <div class="modal fade" id="newRadiologyOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title"><i class="bi bi-activity me-2"></i>Order Imaging / Radiology</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="radiologyForm">
            <div class="mb-3" id="radiologyModalPatientSearch">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-bold mb-0">Select Patient (Search-First UHID/Name)</label>
                <button type="button" class="btn btn-sm btn-outline-info" id="btnLoadRadiologyTests" onclick="loadTests()">
                  <i class="bi bi-cloud-arrow-down me-1"></i> Load Tests (from Diagnostic Bill)
                </button>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Modality</label>
                <select class="form-select" id="radModality">
                  <option value="X-Ray">X-Ray</option>
                  <option value="CT Scan">CT Scan</option>
                  <option value="MRI">MRI</option>
                  <option value="Ultrasound">Ultrasound</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label fw-semibold">Procedure Name</label>
                <input type="text" class="form-control" id="radProcedure" value="Chest X-Ray PA View" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Assigned Radiologist</label>
              <input type="text" class="form-control" id="radDoctor" value="Dr. Radiologist Specialist" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-info text-white" id="btnSaveRadiology">Create Order</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/radiology.js"></script>
</body>
</html>
