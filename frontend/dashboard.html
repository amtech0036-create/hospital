<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — A&M Tech Solutions - Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div id="dashboardAlert" class="alert alert-danger d-none"></div>

    <div class="row g-3" id="statCards">
      <!-- Stat cards injected by dashboard.js -->
    </div>

    <div class="row g-3 mt-1">
      <div class="col-lg-8">
        <div class="stat-card">
          <h6 class="mb-3">Sales by Day</h6>
          <canvas id="salesChart" height="90"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="stat-card">
          <h6 class="mb-3">Top-Selling Products</h6>
          <canvas id="topProductsChart" height="90"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-lg-6">
        <div class="stat-card">
          <h6 class="mb-3">Low Stock Products</h6>
          <div id="lowStockList"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="stat-card">
          <h6 class="mb-3">Recent Payments</h6>
          <div id="recentPaymentsList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
