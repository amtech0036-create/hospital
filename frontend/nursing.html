<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursing Station & MAR — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-person-workspace text-primary me-2"></i>Nursing Station & MAR</h4>
        <p class="text-muted small mb-0">Medication Administration Record (MAR), shift handovers & nursing care notes.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newNursingLogModal">
        <i class="bi bi-plus-lg me-1"></i> Add Nursing Note / MAR
      </button>
    </div>

    <!-- Search-First Patient Lookup -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="nursingPatientSearchContainer">
            <!-- Search-First Component target -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshNursing">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Logs
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Nursing Logs Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Date / Time</th>
                <th>Patient UHID</th>
                <th>Nurse</th>
                <th>Vitals Chart</th>
                <th>MAR Administered</th>
                <th>Shift Handover Notes</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="nursingTableBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading nursing logs...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Nursing Log Modal -->
  <div class="modal fade" id="newNursingLogModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="bi bi-journal-plus me-2"></i>Nursing Entry & MAR</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="nursingForm">
            <div class="mb-3" id="nursingModalPatientSearch">
              <label class="form-label fw-bold">Select Patient (Search-First UHID/Name)</label>
              <!-- SearchFirst component injected here -->
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Nurse Name</label>
                <input type="text" class="form-control" id="nurseName" value="Sister Mary" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Medication Administered (MAR)</label>
                <input type="text" class="form-control" id="marMedicine" placeholder="e.g. Paracetamol 500mg IV at 10:00 AM" />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-3">
                <label class="form-label small text-muted">BP</label>
                <input type="text" class="form-control" id="nurseBp" placeholder="120/80" />
              </div>
              <div class="col-md-3">
                <label class="form-label small text-muted">Pulse</label>
                <input type="text" class="form-control" id="nursePulse" placeholder="78" />
              </div>
              <div class="col-md-3">
                <label class="form-label small text-muted">Temp (°F)</label>
                <input type="text" class="form-control" id="nurseTemp" placeholder="98.4" />
              </div>
              <div class="col-md-3">
                <label class="form-label small text-muted">SpO2</label>
                <input type="text" class="form-control" id="nurseSpo2" placeholder="98%" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Nursing Care & Shift Handover Notes</label>
              <textarea class="form-control" id="shiftHandover" rows="3" placeholder="Patient condition stable, IV fluid continuing at 60ml/hr..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnSaveNursing">Save Nursing Log</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/nursing.js"></script>
</body>
</html>
