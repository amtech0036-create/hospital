<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="productAlert" class="alert alert-danger d-none"></div>

    <div class="stat-card">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h6 class="mb-0">Products</h6>
        <div class="d-flex gap-2">
          <input type="search" class="form-control form-control-sm" id="searchInput" placeholder="Search name or SKU..." style="width:220px" />
          <button class="btn btn-primary btn-sm" id="addBtn">+ Add Product</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Name</th>
              <th>Purchase Price</th>
              <th>Selling Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="productForm">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalTitle">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" id="p_name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">SKU</label>
                <input type="text" class="form-control" id="p_sku" placeholder="Leave blank to auto-generate" />
              </div>

              <div class="col-md-4">
                <label class="form-label">Category</label>
                <select class="form-select" id="p_categoryId"><option value="">—</option></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Brand</label>
                <select class="form-select" id="p_brandId"><option value="">—</option></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Unit</label>
                <select class="form-select" id="p_unitId"><option value="">—</option></select>
              </div>

              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="p_description" rows="2"></textarea>
              </div>

              <div class="col-12"><hr class="my-1" /></div>

              <div class="col-md-4">
                <label class="form-label">Purchase Price (৳)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="p_purchasePrice" required />
              </div>

              <div class="col-md-4">
                <label class="form-label">Pricing Method</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="pricingMethod" id="p_methodMarkup" value="Percentage Markup" checked />
                  <label class="form-check-label" for="p_methodMarkup">Percentage Markup</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="pricingMethod" id="p_methodFixed" value="Fixed Selling Price" />
                  <label class="form-check-label" for="p_methodFixed">Fixed Selling Price</label>
                </div>
              </div>

              <div class="col-md-4">
                <div id="p_markupGroup">
                  <label class="form-label">Markup %</label>
                  <input type="number" step="0.01" min="0" class="form-control" id="p_markupPercentage" value="20" />
                </div>
              </div>

              <div class="col-md-4 offset-md-8">
                <label class="form-label fw-bold">Selling Price (৳)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="p_sellingPrice" />
                <div class="form-text" id="p_sellingPriceHint">Auto-calculated from purchase price + markup.</div>
              </div>

              <div class="col-12"><hr class="my-1" /></div>

              <div class="col-md-4">
                <label class="form-label">Minimum Stock</label>
                <input type="number" step="1" min="0" class="form-control" id="p_minimumStock" value="0" />
              </div>
              <div class="col-md-4" id="p_openingStockGroup">
                <label class="form-label">Opening Stock</label>
                <input type="number" step="1" min="0" class="form-control" id="p_openingStock" value="0" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Batch Number</label>
                <input type="text" class="form-control" id="p_batchNumber" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Expiry Date</label>
                <input type="date" class="form-control" id="p_expiryDate" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
