<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPD Bed Matrix & Ward Management — HIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    .bed-card { cursor: pointer; transition: transform 0.15s ease-in-out; }
    .bed-card:hover { transform: translateY(-3px); }
    .bed-available { border-left: 5px solid #198754 !important; background-color: #f8fff9; }
    .bed-occupied { border-left: 5px solid #dc3545 !important; background-color: #fff8f8; }
    .bed-cleaning { border-left: 5px solid #ffc107 !important; background-color: #fffef0; }
    .bed-maintenance { border-left: 5px solid #6c757d !important; background-color: #f8f9fa; }
  </style>
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="ipdAlert" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h5 class="mb-0"><i class="bi bi-hospital-fill text-primary me-2"></i>IPD Real-Time Bed Matrix & Ward Dashboard</h5>
            <small class="text-muted">Visual ward grid for patient admissions, transfers, bed state locking, and discharges.</small>
          </div>
          <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addBedModal">
            <i class="bi bi-plus-circle me-1"></i>Add New Bed
          </button>
        </div>
      </div>
    </div>

    <!-- Ward Summary Stats -->
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-success text-white py-2 text-center">
          <h4 id="statBedAvailable" class="mb-0 fw-bold">0</h4>
          <small>Available Beds</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-danger text-white py-2 text-center">
          <h4 id="statBedOccupied" class="mb-0 fw-bold">0</h4>
          <small>Occupied Beds</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-warning text-dark py-2 text-center">
          <h4 id="statBedCleaning" class="mb-0 fw-bold">0</h4>
          <small>Cleaning / Turnover</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-secondary text-white py-2 text-center">
          <h4 id="statBedTotal" class="mb-0 fw-bold">0</h4>
          <small>Total Ward Capacity</small>
        </div>
      </div>
    </div>

    <!-- Ward Filter & Matrix Grid -->
    <div class="card shadow-sm border-0 mb-3">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h6 class="mb-0 fw-bold"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Bed Availability Grid</h6>
        <div class="btn-group btn-group-sm" id="wardFilterGroup">
          <button class="btn btn-outline-primary active" data-ward="all">All Wards</button>
          <button class="btn btn-outline-primary" data-ward="general">General</button>
          <button class="btn btn-outline-primary" data-ward="cabin">Cabin</button>
          <button class="btn btn-outline-primary" data-ward="icu">ICU</button>
          <button class="btn btn-outline-primary" data-ward="emergency">Emergency</button>
        </div>
      </div>
      <div class="card-body">
        <div id="bedGridContainer" class="row g-3">
          <div class="text-center py-4 text-muted">Loading real-time bed matrix...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Admit Patient Modal -->
  <div class="modal fade" id="admitModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-check text-success me-2"></i>Admit Patient to Bed</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="admitForm">
            <input type="hidden" id="admitBedId" />
            <div class="mb-3">
              <label class="form-label fw-bold">Assigned Bed</label>
              <input type="text" id="admitBedNumber" class="form-control form-control-sm" readonly />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Select Patient (UHID) *</label>
              <select id="admitPatientSelect" class="form-select form-select-sm" required>
                <option value="">-- Select Patient --</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Attending Doctor *</label>
              <select id="admitDoctorSelect" class="form-select form-select-sm" required>
                <option value="">-- Select Doctor --</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Advance Admission Deposit (BDT)</label>
              <input type="number" id="admitDeposit" class="form-control form-control-sm" value="5000" min="0" />
            </div>
            <div class="mb-3">
              <label class="form-label">Initial Nursing / Clinical Notes</label>
              <textarea id="admitNotes" class="form-control form-control-sm" rows="2" placeholder="e.g. Post-op monitoring required..."></textarea>
            </div>
            <div class="text-end">
              <button type="button" class="btn btn-secondary btn-sm me-1" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-check-circle me-1"></i>Confirm Admission</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/ipdBeds.js"></script>
</body>
</html>
