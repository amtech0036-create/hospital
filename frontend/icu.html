<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICU / CCU Workstation — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-activity text-danger me-2"></i>ICU / CCU Critical Care Unit</h4>
        <p class="text-muted small mb-0">Continuous vital signs flowsheets, ventilator status, intake/output & critical progress notes.</p>
      </div>
      <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#newIcuModal">
        <i class="bi bi-plus-lg me-1"></i> Admit to ICU
      </button>
    </div>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="icuSearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshIcu">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Monitoring
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ICU Patients Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Bed No.</th>
                <th>Patient Details & UHID</th>
                <th>Ventilator Mode</th>
                <th>Current Vitals</th>
                <th>Intake / Output</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="icuTableBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading ICU monitoring data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Admit ICU Modal -->
  <div class="modal fade" id="newIcuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title"><i class="bi bi-heart-pulse me-2"></i>ICU Patient Admission & Monitoring</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="icuForm">
            <div class="mb-3" id="icuModalPatientSearch">
              <label class="form-label fw-bold">Patient (Search-First UHID/Name)</label>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">ICU Bed Number</label>
                <input type="text" class="form-control" id="icuBedNumber" value="ICU-Bed-01" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Ventilator Status</label>
                <select class="form-select" id="icuVentilator">
                  <option value="Off Ventilator">Off Ventilator (Nasal Cannula / Mask)</option>
                  <option value="Invasive Ventilator (CMV/AC)">Invasive Ventilator (CMV/AC Mode)</option>
                  <option value="NIV / BiPAP">Non-Invasive Ventilator (NIV/BiPAP)</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-3">
                <label class="form-label small">BP</label>
                <input type="text" class="form-control" id="icuBp" placeholder="110/70" />
              </div>
              <div class="col-md-3">
                <label class="form-label small">Pulse</label>
                <input type="text" class="form-control" id="icuPulse" placeholder="92" />
              </div>
              <div class="col-md-3">
                <label class="form-label small">Intake (ml)</label>
                <input type="number" class="form-control" id="icuIntake" value="1200" />
              </div>
              <div class="col-md-3">
                <label class="form-label small">Output (ml)</label>
                <input type="number" class="form-control" id="icuOutput" value="1050" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Critical Progress Notes</label>
              <textarea class="form-control" id="icuDoctorNotes" rows="3" placeholder="Intubation performed, vitals being monitored continuously..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnSaveIcu">Admit & Monitor</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/icu.js"></script>
</body>
</html>
