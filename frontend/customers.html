<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="customerAlert" class="alert alert-danger d-none"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="listTab">Customers</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="ledgerTab">Ledger</button></li>
    </ul>

    <!-- List tab -->
    <div id="listTab" class="tab-pane">
      <div class="stat-card">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h6 class="mb-0">Customers</h6>
          <div class="d-flex gap-2">
            <input type="search" class="form-control form-control-sm" id="searchInput" placeholder="Search name, phone, email..." style="width:240px" />
            <button class="btn btn-primary btn-sm" id="addBtn">+ Add Customer</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Name</th><th>Phone</th><th>Email</th><th>Balance Due</th><th>Status</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Ledger tab -->
    <div id="ledgerTab" class="tab-pane d-none">
      <div class="row g-3">
        <div class="col-lg-5">
          <div class="stat-card">
            <h6 class="mb-3">Record a Transaction</h6>
            <form id="ledgerForm">
              <div class="mb-3">
                <label class="form-label">Customer</label>
                <div id="ledgerCustomerSearchMount"></div>
              </div>
              <div class="mb-3">
                <label class="form-label">Type</label>
                <select class="form-select" id="ledgerType" required>
                  <option value="Invoice">Invoice</option>
                  <option value="Payment Received">Payment Received</option>
                  <option value="Sales Return">Sales Return</option>
                  <option value="Adjustment Increase">Adjustment Increase</option>
                  <option value="Adjustment Decrease">Adjustment Decrease</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Amount (৳)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="ledgerAmount" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Note</label>
                <textarea class="form-control" id="ledgerNote" rows="2"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Save Transaction</button>
            </form>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
              <h6 class="mb-0">History</h6>
              <div class="fw-bold" id="ledgerBalanceLabel"></div>
            </div>
            <div class="row g-2 mb-3 align-items-end">
              <div class="col-auto">
                <label class="form-label small mb-0">From</label>
                <input type="date" class="form-control form-control-sm" id="ledgerDateFrom" />
              </div>
              <div class="col-auto">
                <label class="form-label small mb-0">To</label>
                <input type="date" class="form-control form-control-sm" id="ledgerDateTo" />
              </div>
              <div class="col-auto">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="ledgerDateClear">Clear</button>
              </div>
            </div>
            <div id="ledgerDateSummary" class="alert alert-info py-2 mb-3 d-none small"></div>
            <table class="table">
              <thead>
                <tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr>
              </thead>
              <tbody id="ledgerHistoryBody">
                <tr><td colspan="4" class="text-center text-muted py-4">Select a customer above.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Customer Modal -->
  <div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="customerForm">
          <div class="modal-header">
            <h5 class="modal-title" id="customerModalTitle">Add Customer</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="c_name" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" id="c_phone" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="c_email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="c_address" rows="2"></textarea>
            </div>
            <div class="mb-3" id="c_openingBalanceGroup">
              <label class="form-label">Opening Balance (৳)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="c_openingBalance" value="0" />
              <div class="form-text">Amount this customer already owed before joining the system.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dateRangeFilter.js"></script>
  <script src="js/searchSelect.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
