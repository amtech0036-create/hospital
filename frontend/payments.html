<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>
  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="paymentAlert" class="alert alert-danger d-none"></div>
    <div id="paymentSuccess" class="alert alert-success d-none"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="newTab">Record Payment</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="listTab">Payment History</button></li>
    </ul>

    <div id="newTab" class="tab-pane">
      <div class="stat-card col-lg-6">
        <form id="paymentForm">
          <div class="mb-3">
            <label class="form-label">Party Type</label>
            <select class="form-select" id="partyType">
              <option value="Customer">Customer (money in)</option>
              <option value="Supplier">Supplier (money out)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" id="partyLabel">Customer</label>
            <div id="partySearchMount"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (৳)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="amount" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select class="form-select" id="paymentMethod">
              <option value="Cash">Cash</option>
              <option value="Bank">Bank</option>
              <option value="Mobile Banking">Mobile Banking</option>
              <option value="Card">Card</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Date</label>
            <input type="datetime-local" class="form-control" id="paymentDate" />
          </div>
          <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea class="form-control" id="note" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Payment</button>
        </form>
      </div>
    </div>

    <div id="listTab" class="tab-pane d-none">
      <div class="stat-card">
        <div class="row g-2 mb-3 align-items-end">
          <div class="col-auto">
            <label class="form-label small mb-0">From</label>
            <input type="date" class="form-control form-control-sm" id="paymentDateFrom" />
          </div>
          <div class="col-auto">
            <label class="form-label small mb-0">To</label>
            <input type="date" class="form-control form-control-sm" id="paymentDateTo" />
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="paymentDateClear">Clear</button>
          </div>
        </div>
        <div id="paymentDateSummary" class="alert alert-info py-2 mb-3 d-none small"></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead><tr><th>Payment #</th><th>Receipt #</th><th>Date</th><th>Party</th><th>Direction</th><th>Amount</th><th>Method</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="paymentTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dateRangeFilter.js"></script>
  <script src="js/searchSelect.js"></script>
  <script src="js/companySettings.js"></script>
  <script src="js/paymentReceiptDocument.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
