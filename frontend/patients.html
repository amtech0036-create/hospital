<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Directory & Master Management — HIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="patientAlert" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-0"><i class="bi bi-people-fill text-primary me-2"></i>Patient Directory (UHID Master)</h5>
          <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#patientModal">
            <i class="bi bi-person-plus-fill me-1"></i>Register New Patient
          </button>
        </div>
      </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-center">
          <div class="col-md-6">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="searchPatientInput" class="form-control" placeholder="Search by UHID, Full Name, or Mobile Phone Number..." />
            </div>
          </div>
          <div class="col-md-3">
            <select id="genderFilter" class="form-select form-select-sm">
              <option value="">All Genders</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnRefreshPatients">
              <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Patient Directory Table -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>UHID</th>
                <th>Full Name</th>
                <th>Gender / Age</th>
                <th>Mobile Phone</th>
                <th>Blood Group</th>
                <th>Emergency Contact</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="patientTableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading patient records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Register / Edit Patient Modal -->
  <div class="modal fade" id="patientModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="modalPatientForm">
          <div class="modal-header">
            <h5 class="modal-title" id="patientModalTitle"><i class="bi bi-person-vcard me-2"></i>Patient Registration</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="modalPatientId" />
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">UHID Number</label>
                <input type="text" id="modalUhid" class="form-control form-control-sm bg-light" placeholder="Auto-generated UHID" readonly />
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Full Name *</label>
                <input type="text" id="modalFullName" class="form-control form-control-sm" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-4">
                <label class="form-label small mb-0">Gender *</label>
                <select id="modalGender" class="form-select form-select-sm" required>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small mb-0">Age (Years) *</label>
                <input type="number" id="modalAge" class="form-control form-control-sm" min="0" max="120" required />
              </div>
              <div class="col-md-4">
                <label class="form-label small mb-0">Blood Group</label>
                <select id="modalBloodGroup" class="form-select form-select-sm">
                  <option value="Unknown">Unknown</option>
                  <option value="A+">A+</option><option value="A-">A-</option>
                  <option value="B+">B+</option><option value="B-">B-</option>
                  <option value="AB+">AB+</option><option value="AB-">AB-</option>
                  <option value="O+">O+</option><option value="O-">O-</option>
                </select>
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">Mobile Phone *</label>
                <input type="text" id="modalPhone" class="form-control form-control-sm" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Email Address</label>
                <input type="email" id="modalEmail" class="form-control form-control-sm" />
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-0">Emergency Contact Name & Phone</label>
              <input type="text" id="modalEmergencyContact" class="form-control form-control-sm" placeholder="e.g. John Doe (Brother) - 01700000000" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save Patient</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/patients.js"></script>
</body>
</html>
