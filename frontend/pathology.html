<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathology & Lab Workstation — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-eyedropper text-purple me-2"></i>Pathology Laboratory Workstation</h4>
        <p class="text-muted small mb-0">Sample barcode tracking, multi-parameter test result entry & pathologist verification.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newLabOrderModal">
        <i class="bi bi-plus-lg me-1"></i> New Pathology Order
      </button>
    </div>

    <!-- Search-First Sample & Patient Search Bar -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="pathologySearchContainer">
            <!-- Search-First Component target -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshPathology">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Worklist
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pathology Orders Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Barcode / Date</th>
                <th>Patient Name & UHID</th>
                <th>Test Name & Category</th>
                <th>Sample Type</th>
                <th>Technician</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="pathologyTableBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading pathology orders...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Pathology Order Modal -->
  <div class="modal fade" id="newLabOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title"><i class="bi bi-journal-check me-2"></i>Create Pathology Test Order</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="pathologyForm">
            <div class="mb-3" id="pathologyModalPatientSearch">
              <label class="form-label fw-bold">Patient (Search-First UHID/Name)</label>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Test Name</label>
                <input type="text" class="form-control" id="labTestName" value="Complete Blood Count (CBC)" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Category</label>
                <input type="text" class="form-control" id="labCategory" value="Hematology" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Sample Type</label>
                <input type="text" class="form-control" id="labSampleType" value="EDTA Whole Blood" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnSaveLabOrder">Generate Order & Barcode</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/pathology.js"></script>
</body>
</html>
