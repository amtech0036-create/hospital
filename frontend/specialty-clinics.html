<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specialty Clinics — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-hospital text-primary me-2"></i>Specialty Clinical Modules</h4>
        <p class="text-muted small mb-0">Cardiology (ECG/Echo), Obstetrics & Gynecology (ANC/Labor), Pediatrics & Neonatal (NICU).</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newSpecialtyModal">
        <i class="bi bi-plus-lg me-1"></i> New Specialty Record
      </button>
    </div>

    <!-- Department Selector Tabs -->
    <ul class="nav nav-pills mb-3" id="specialtyTabs">
      <li class="nav-item">
        <button class="nav-link active" data-dept="Cardiology">Cardiology (ECG & Echo)</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-dept="ObsGynae">Obs & Gynae (ANC & Labor)</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-dept="Pediatrics">Pediatrics & Neonatal (NICU)</button>
      </li>
    </ul>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="specialtySearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshSpecialty">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Records
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Specialty Records Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Department</th>
                <th>Patient UHID & Name</th>
                <th>Specialist Doctor</th>
                <th>Clinical Observations / Findings</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="specialtyTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Loading specialty clinical records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Specialty Record Modal -->
  <div class="modal fade" id="newSpecialtyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="bi bi-journal-medical me-2"></i>Create Specialty Clinical Entry</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="specialtyForm">
            <div class="mb-3" id="specialtyModalPatientSearch">
              <label class="form-label fw-bold">Select Patient (Search-First UHID/Name)</label>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Specialty Department</label>
                <select class="form-select" id="spDepartment">
                  <option value="Cardiology">Cardiology</option>
                  <option value="ObsGynae">Obstetrics & Gynecology</option>
                  <option value="Pediatrics">Pediatrics & Neonatal</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Consultant Doctor</label>
                <input type="text" class="form-control" id="spDoctor" value="Dr. Specialist" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Clinical Findings & Notes</label>
              <textarea class="form-control" id="spNotes" rows="3" placeholder="e.g., ECG shows normal sinus rhythm / ANC visit 28 weeks gestation..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnSaveSpecialty">Save Specialty Record</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/specialtyClinics.js"></script>
</body>
</html>
