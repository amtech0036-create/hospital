<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortuary Management — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-journal-x text-secondary me-2"></i>Mortuary & Death Registration</h4>
        <p class="text-muted small mb-0">Death registration, cold chamber tracking, cause of death records & authorized body release.</p>
      </div>
      <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#newMortuaryModal">
        <i class="bi bi-plus-lg me-1"></i> Register Death / Mortuary Record
      </button>
    </div>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="mortuarySearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshMortuary">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Mortuary Logs
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mortuary Records Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Chamber No.</th>
                <th>Deceased Name & UHID</th>
                <th>Date of Death</th>
                <th>Cause of Death</th>
                <th>Authorized Recipient</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="mortuaryTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Loading mortuary records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Mortuary Modal -->
  <div class="modal fade" id="newMortuaryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-secondary text-white">
          <h5 class="modal-title"><i class="bi bi-file-earmark-medical me-2"></i>Register Death & Mortuary Chamber</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="mortuaryForm">
            <div class="mb-3" id="mortuaryModalPatientSearch">
              <label class="form-label fw-bold">Select Deceased Patient (Search-First UHID/Name)</label>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Deceased Name (If Unregistered)</label>
                <input type="text" class="form-control" id="mortDeceasedName" placeholder="Name of deceased" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Chamber Allocation</label>
                <input type="text" class="form-control" id="mortChamber" value="Chamber-01 (Cold Storage)" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Cause of Death</label>
              <textarea class="form-control" id="mortCause" rows="2" placeholder="Cardiorespiratory arrest secondary to acute myocardial infarction..."></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Authorized Recipient / Kin Details</label>
              <input type="text" class="form-control" id="mortRecipient" placeholder="Relative Name, NID Number, Contact Mobile" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark" id="btnSaveMortuary">Save Mortuary Entry</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/mortuary.js"></script>
</body>
</html>
