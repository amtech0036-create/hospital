<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood Bank Inventory — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-droplet-fill text-danger me-2"></i>Blood Bank Inventory & Cross-Matching</h4>
        <p class="text-muted small mb-0">Donor collection records, component separation (PRBC/FFP/Platelets) & patient cross-matching.</p>
      </div>
      <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#newBloodBagModal">
        <i class="bi bi-plus-lg me-1"></i> Register Donor Blood Bag
      </button>
    </div>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="bloodBankSearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshBloodBank">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Inventory
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Blood Bank Inventory Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Blood Group</th>
                <th>Bag ID / Donor</th>
                <th>Component</th>
                <th>Volume (ml)</th>
                <th>Expiry Date</th>
                <th>Cross-matched UHID</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="bloodBankTableBody">
              <tr>
                <td colspan="8" class="text-center py-4 text-muted">Loading blood bank inventory...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Register Donor Blood Bag Modal -->
  <div class="modal fade" id="newBloodBagModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title"><i class="bi bi-droplet-half me-2"></i>Register Donor Blood Bag</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="bloodBagForm">
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Blood Group</label>
                <select class="form-select" id="bbBloodGroup">
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="O+" selected>O+</option>
                  <option value="O-">O-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label fw-semibold">Donor Name</label>
                <input type="text" class="form-control" id="bbDonorName" placeholder="Voluntary Donor Name" />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Component Type</label>
                <select class="form-select" id="bbComponent">
                  <option value="Packed Red Blood Cells (PRBC)">Packed Red Blood Cells (PRBC)</option>
                  <option value="Fresh Frozen Plasma (FFP)">Fresh Frozen Plasma (FFP)</option>
                  <option value="Platelet Concentrate">Platelet Concentrate</option>
                  <option value="Whole Blood">Whole Blood</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Quantity (ml)</label>
                <input type="number" class="form-control" id="bbQuantity" value="350" min="50" step="50" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnSaveBloodBag">Store Blood Bag</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/bloodBank.js"></script>
</body>
</html>
