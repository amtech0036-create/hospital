<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchases — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="purchaseAlert" class="alert alert-danger d-none"></div>
    <div id="purchaseSuccess" class="alert alert-success d-none"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="newTab">New Purchase</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="listTab">Purchase History</button></li>
    </ul>

    <div id="newTab" class="tab-pane">
      <div class="stat-card">
        <form id="purchaseForm">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Supplier</label>
              <div id="supplierSearchMount"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Purchase Date</label>
              <input type="datetime-local" class="form-control" id="purchaseDate" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="paymentMethod">
                <option value="Cash">Cash</option>
                <option value="Bank">Bank</option>
                <option value="Credit">Credit</option>
              </select>
            </div>
          </div>

          <div class="table-responsive mb-2">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th style="width:40%">Product</th>
                  <th style="width:15%">Qty</th>
                  <th style="width:20%">Unit Cost (৳)</th>
                  <th style="width:20%">Line Total</th>
                  <th style="width:5%"></th>
                </tr>
              </thead>
              <tbody id="lineItemsBody"></tbody>
            </table>
          </div>
          <button type="button" class="btn btn-sm btn-outline-primary mb-3" id="addLineBtn">+ Add Line</button>

          <div class="row g-3 justify-content-end">
            <div class="col-md-4">
              <div class="mb-2 d-flex justify-content-between"><span>Subtotal</span><strong id="subtotalLabel">৳0</strong></div>
              <div class="mb-2">
                <label class="form-label">Discount (৳)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="discount" value="0" />
              </div>
              <div class="mb-2 d-flex justify-content-between fs-5"><span>Total</span><strong id="totalLabel">৳0</strong></div>
              <div class="mb-2">
                <label class="form-label">Amount Paid (৳)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="amountPaid" value="0" />
              </div>
              <div class="mb-3">
                <label class="form-label">Note</label>
                <textarea class="form-control" id="note" rows="2"></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Complete Purchase</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div id="listTab" class="tab-pane d-none">
      <div class="stat-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Purchase #</th><th>Date</th><th>Supplier</th><th>Total</th><th>Paid</th><th>Status</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="purchaseTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="purchaseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="purchaseModalTitle">Purchase</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="purchaseModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-warning d-none" id="purchaseReturnBtn">Return Items</button>
          <button type="button" class="btn btn-outline-danger d-none" id="purchaseCancelBtn">Cancel Purchase</button>
          <button type="button" class="btn btn-outline-secondary" id="purchasePrintBtn">Print</button>
          <button type="button" class="btn btn-outline-primary" id="purchasePdfBtn">Download PDF</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="returnModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="returnForm">
          <div class="modal-header"><h5 class="modal-title">Return Items</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body" id="returnFormBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Submit Return</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/searchSelect.js"></script>
  <script src="js/companySettings.js"></script>
  <script src="js/purchaseDocument.js"></script>
  <script src="js/purchases.js"></script>
</body>
</html>
