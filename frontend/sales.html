<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="saleAlert" class="alert alert-danger d-none"></div>
    <div id="saleSuccess" class="alert alert-success d-none"></div>

    <div class="stat-card">
      <h6 class="mb-3">New Sale</h6>
      <form id="saleForm">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Customer</label>
            <div id="customerSearchMount"></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Sale Date</label>
            <input type="datetime-local" class="form-control" id="saleDate" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Payment Method</label>
            <select class="form-select" id="paymentMethod">
              <option value="Cash">Cash</option>
              <option value="Bank">Bank</option>
              <option value="Credit">Credit</option>
            </select>
          </div>
        </div>

        <div class="table-responsive mb-2">
          <table class="table align-middle">
            <thead>
              <tr>
                <th style="width:35%">Product</th>
                <th style="width:12%">Stock</th>
                <th style="width:12%">Qty</th>
                <th style="width:15%">Unit Price (৳)</th>
                <th style="width:15%">Line Total</th>
                <th style="width:11%"></th>
              </tr>
            </thead>
            <tbody id="lineItemsBody"></tbody>
          </table>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary mb-3" id="addLineBtn">+ Add Line</button>

        <div class="row g-3 justify-content-end">
          <div class="col-md-4">
            <div class="mb-2 d-flex justify-content-between"><span>Subtotal</span><strong id="subtotalLabel">৳0</strong></div>
            <div class="mb-2">
              <label class="form-label">Discount (৳)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="discount" value="0" />
            </div>
            <div class="mb-2 d-flex justify-content-between fs-5"><span>Total</span><strong id="totalLabel">৳0</strong></div>
            <div class="mb-2">
              <label class="form-label">Amount Paid (৳)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="amountPaid" value="0" />
            </div>
            <div class="mb-3">
              <label class="form-label">Note</label>
              <textarea class="form-control" id="note" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Complete Sale</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/searchSelect.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
