<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor & Consultant Master Management — HIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="doctorAlert" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-0"><i class="bi bi-person-badge-fill text-primary me-2"></i>Doctor & Consultant Master Directory</h5>
          <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#doctorModal">
            <i class="bi bi-person-plus-fill me-1"></i>Add New Doctor
          </button>
        </div>
      </div>
    </div>

    <!-- Doctor Table -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Doctor Name</th>
                <th>Specialization</th>
                <th>Department</th>
                <th>Phone / Email</th>
                <th>Commission Rate</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="doctorTableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading doctors directory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Doctor Modal -->
  <div class="modal fade" id="doctorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="doctorForm">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-person-badge me-2"></i>Register Doctor / Consultant</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="doctorId" />
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">Doctor Full Name *</label>
                <input type="text" id="docName" class="form-control form-control-sm" placeholder="Dr. First Last, MD" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Specialization *</label>
                <input type="text" id="docSpecialization" class="form-control form-control-sm" placeholder="e.g. Pathology / Radiology / Cardiology" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">Department *</label>
                <input type="text" id="docDepartment" class="form-control form-control-sm" placeholder="e.g. Diagnostics / OPD" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Phone Number</label>
                <input type="text" id="docPhone" class="form-control form-control-sm" />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">Commission Type</label>
                <select id="docCommType" class="form-select form-select-sm">
                  <option value="Percentage">Percentage (%)</option>
                  <option value="Fixed">Fixed Amount (BDT)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Commission Value</label>
                <input type="number" id="docCommValue" class="form-control form-control-sm" value="10" min="0" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save Doctor Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/doctors.js"></script>
</body>
</html>
