<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div id="stockAlert" class="alert alert-danger d-none"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="lowStockTab">Low Stock</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="adjustTab">Stock Adjustment</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="historyTab">Product History</button></li>
    </ul>

    <!-- Low stock tab -->
    <div id="lowStockTab" class="tab-pane">
      <div class="stat-card">
        <table class="table">
          <thead>
            <tr><th>SKU</th><th>Product</th><th>Current Stock</th><th>Minimum Stock</th></tr>
          </thead>
          <tbody id="lowStockBody">
            <tr><td colspan="4" class="text-center text-muted py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Adjustment tab -->
    <div id="adjustTab" class="tab-pane d-none">
      <div class="stat-card" style="max-width: 480px;">
        <h6 class="mb-3">Record a Stock Transaction</h6>
        <form id="adjustForm">
          <div class="mb-3">
            <label class="form-label">Product ID</label>
            <input type="text" class="form-control" id="adjProductId" placeholder="e.g. PROD-000001" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" id="adjType" required>
              <option value="Stock Adjustment In">Stock Adjustment In</option>
              <option value="Stock Adjustment Out">Stock Adjustment Out</option>
              <option value="Damaged">Damaged</option>
              <option value="Expired">Expired</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" step="any" min="0.01" class="form-control" id="adjQuantity" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea class="form-control" id="adjNote" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Transaction</button>
        </form>
      </div>
    </div>

    <!-- History tab -->
    <div id="historyTab" class="tab-pane d-none">
      <div class="stat-card">
        <div class="d-flex gap-2 mb-3">
          <input type="text" class="form-control" id="historyProductId" placeholder="Product ID, e.g. PROD-000001" style="max-width: 260px;" />
          <button class="btn btn-outline-primary" id="loadHistoryBtn">Load History</button>
        </div>
        <div id="currentStockLabel" class="fw-bold mb-2"></div>
        <table class="table">
          <thead>
            <tr><th>Date</th><th>Type</th><th>Quantity</th><th>Reference</th><th>Note</th></tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="5" class="text-center text-muted py-4">Enter a Product ID above.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/stock.js"></script>
</body>
</html>
