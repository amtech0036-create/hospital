<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AM Tech Solutions ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Company Branding Header (Editable from IDE in config.js or login.html) -->
      <div class="auth-company-header">
        <div class="auth-company-logo" id="companyLogoWrapper">
          <img src="assets/amtechlogo.png" alt="Company Logo" id="companyLogoImg"
            onerror="this.style.display='none'; document.getElementById('companyLogoSvg').style.display='block';" />
          <svg id="companyLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M20 7h-3a2 2 0 0 1-2-2V2" />
            <path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z" />
            <path d="M3 7.6v12.4a2 2 0 0 0 2 2h12" />
          </svg>
        </div>
        <h4 class="auth-company-name mb-1 fw-bold" id="companyNameDisplay">AM Tech Solutions BD</h4>
        <p class="text-muted small mb-0">Sign in to your account</p>
      </div>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required autocomplete="username"
            placeholder="name@company.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required autocomplete="current-password"
            placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">Login</button>
      </form>

      <!-- Company Contact Details (Editable ONLY from IDE code) -->
      <div class="auth-company-info" id="companyInfoSection">
        <div class="auth-company-info-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          <span id="companyAddressDisplay">Baraipara Bazar Ashulia Savar Dhaka</span>
        </div>
        <div class="auth-company-info-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
          </svg>
          <span id="companyPhoneDisplay">+880 1736002401</span>
        </div>
        <div class="auth-company-info-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
          <a href="https://amtechsolutionsbd.vercel.app/" target="_blank" rel="noopener noreferrer"
            id="companyWebsiteLink">
            <span id="companyWebsiteDisplay">www.amtechsolutionsbd.com</span>
          </a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
