<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoices — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="invoiceAlert" class="alert alert-danger d-none"></div>

    <div class="stat-card">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h6 class="mb-0">Invoices / Sales</h6>
        <a href="/sales.html" class="btn btn-primary btn-sm">+ New Sale</a>
      </div>
      <div class="row g-2 mb-3 align-items-end">
        <div class="col-auto">
          <label class="form-label small mb-0">From</label>
          <input type="date" class="form-control form-control-sm" id="invoiceDateFrom" />
        </div>
        <div class="col-auto">
          <label class="form-label small mb-0">To</label>
          <input type="date" class="form-control form-control-sm" id="invoiceDateTo" />
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="invoiceDateClear">Clear</button>
        </div>
      </div>
      <div id="invoiceDateSummary" class="alert alert-info py-2 mb-3 d-none small"></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Invoice #</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Status</th><th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="invoiceTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Invoice detail modal -->
  <div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="invoiceModalTitle">Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="invoiceModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-warning d-none" id="invoiceReturnBtn">Return Items</button>
          <button type="button" class="btn btn-outline-danger d-none" id="invoiceCancelBtn">Cancel Sale</button>
          <button type="button" class="btn btn-outline-secondary" id="invoicePrintBtn">Print</button>
          <button type="button" class="btn btn-outline-primary" id="invoicePdfBtn">Download PDF</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="returnModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="returnForm">
          <div class="modal-header">
            <h5 class="modal-title">Return Items</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="returnFormBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Submit Return</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dateRangeFilter.js"></script>
  <script src="js/companySettings.js"></script>
  <script src="js/invoiceDocument.js"></script>
  <script src="js/invoices.js"></script>
</body>
</html>
