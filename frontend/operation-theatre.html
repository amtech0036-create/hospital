<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation Theatre (OT) — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-scissors text-danger me-2"></i>Operation Theatre (OT) & Surgery Suite</h4>
        <p class="text-muted small mb-0">Surgery scheduling, surgical safety checklist, surgeon/anesthetist assignment & procedure logs.</p>
      </div>
      <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#newOtModal">
        <i class="bi bi-plus-lg me-1"></i> Schedule Surgery
      </button>
    </div>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="otSearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshOt">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Schedule
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- OT Surgeries Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>OT Room</th>
                <th>Patient & UHID</th>
                <th>Surgery Procedure</th>
                <th>Lead Surgeon</th>
                <th>Anesthetist</th>
                <th>Checklist</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="otTableBody">
              <tr>
                <td colspan="8" class="text-center py-4 text-muted">Loading OT surgery schedule...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Schedule Surgery Modal -->
  <div class="modal fade" id="newOtModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title"><i class="bi bi-calendar-event me-2"></i>Schedule Operation Theatre Surgery</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="otForm">
            <div class="mb-3" id="otModalPatientSearch">
              <label class="form-label fw-bold">Select Patient (Search-First UHID/Name)</label>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Surgery Procedure Name</label>
                <input type="text" class="form-control" id="otProcedure" value="Laparoscopic Cholecystectomy" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">OT Room Allocation</label>
                <input type="text" class="form-control" id="otRoom" value="OT Suite 1" />
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Lead Surgeon</label>
                <input type="text" class="form-control" id="otSurgeon" value="Dr. Chief Surgeon" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Anesthetist</label>
                <input type="text" class="form-control" id="otAnesthetist" value="Dr. Senior Anesthetist" />
              </div>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="otChecklist" checked />
              <label class="form-check-label fw-semibold" for="otChecklist">WHO Surgical Safety Checklist Verified (Sign-In, Time-Out, Sign-Out)</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark" id="btnSaveOt">Schedule Surgery</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/operationTheatre.js"></script>
</body>
</html>
