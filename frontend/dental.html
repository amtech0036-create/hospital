<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dental Department — Hospital ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-emoji-smile text-info me-2"></i>Dental Department & Charting</h4>
        <p class="text-muted small mb-0">Tooth matrix, dental procedure records, treatment plans & dental history.</p>
      </div>
      <button class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#newDentalModal">
        <i class="bi bi-plus-lg me-1"></i> New Dental Entry
      </button>
    </div>

    <!-- Search-First Component target -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-8" id="dentalSearchContainer">
            <!-- Search-First Component injected here -->
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-secondary w-100" id="btnRefreshDental">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Records
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dental Records Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Patient Details & UHID</th>
                <th>Dentist</th>
                <th>Tooth / Matrix</th>
                <th>Procedure Performed</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="dentalTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Loading dental records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Dental Modal -->
  <div class="modal fade" id="newDentalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title"><i class="bi bi-emoji-smile-fill me-2"></i>Record Dental Procedure</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="dentalForm">
            <div class="mb-3" id="dentalModalPatientSearch">
              <label class="form-label fw-bold">Select Patient (Search-First UHID/Name)</label>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Dentist Name</label>
                <input type="text" class="form-control" id="denDentist" value="Dr. Dental Specialist" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Tooth Number / Matrix</label>
                <input type="text" class="form-control" id="denTooth" value="Tooth #14 & #15" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Procedure & Treatment Plan</label>
              <textarea class="form-control" id="denProcedure" rows="3" placeholder="Root Canal Treatment (RCT) stage 1 completed, temporary filling placed..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-info text-white" id="btnSaveDental">Save Dental Record</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/dental.js"></script>
</body>
</html>
