<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>
  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="expenseAlert" class="alert alert-danger d-none"></div>
    <div id="expenseSuccess" class="alert alert-success d-none"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-tab="newTab">Record Expense</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="listTab">Expense History</button></li>
    </ul>

    <div id="newTab" class="tab-pane">
      <div class="stat-card col-lg-6">
        <form id="expenseForm">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="Daily Lunch Bill">Daily Lunch Bill</option>
              <option value="Snacks Bill">Snacks Bill</option>
              <option value="Office Rent">Office Rent</option>
              <option value="Kitchen Items Buying Bill">Kitchen Items Buying Bill</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (৳)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="amount" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select class="form-select" id="paymentMethod">
              <option value="Cash">Cash</option>
              <option value="Bank">Bank</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Expense Date</label>
            <input type="datetime-local" class="form-control" id="expenseDate" />
          </div>
          <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea class="form-control" id="note" rows="2" placeholder="Optional — required when category is Others"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </form>
      </div>
    </div>

    <div id="listTab" class="tab-pane d-none">
      <div class="stat-card">
        <div class="row g-2 mb-3 align-items-end">
          <div class="col-auto">
            <label class="form-label small mb-0">From</label>
            <input type="date" class="form-control form-control-sm" id="expenseDateFrom" />
          </div>
          <div class="col-auto">
            <label class="form-label small mb-0">To</label>
            <input type="date" class="form-control form-control-sm" id="expenseDateTo" />
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="expenseDateClear">Clear</button>
          </div>
        </div>
        <div id="expenseDateSummary" class="alert alert-info py-2 mb-3 d-none small"></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>Expense #</th><th>Date</th><th>Category</th><th>Amount</th><th>Method</th><th>Note</th></tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dateRangeFilter.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
