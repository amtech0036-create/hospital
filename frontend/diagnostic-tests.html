<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostic Test Catalog Master — HIS / LIS / RIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="testCatalogAlert" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-0"><i class="bi bi-journal-medical text-primary me-2"></i>Diagnostic Test Catalog Master</h5>
          <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#testModal">
            <i class="bi bi-plus-circle-fill me-1"></i>Add New Diagnostic Test
          </button>
        </div>
      </div>
    </div>

    <!-- Catalog Table -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Test Code</th>
                <th>Test Name</th>
                <th>Department</th>
                <th>Category</th>
                <th>Sample Type</th>
                <th>Price (BDT)</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="testCatalogTbody">
              <tr><td colspan="8" class="text-center text-muted py-4">Loading diagnostic test catalog...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Test Modal -->
  <div class="modal fade" id="testModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="testForm">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-journal-plus me-2"></i>Add Diagnostic Test Master</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="catalogId" />
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">Test Code *</label>
                <input type="text" id="catalogCode" class="form-control form-control-sm" placeholder="e.g. LAB-CBC or RAD-MRI-KNEE" required />
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Test Full Name *</label>
                <input type="text" id="catalogName" class="form-control form-control-sm" placeholder="e.g. Complete Blood Count" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-4">
                <label class="form-label small mb-0">Department *</label>
                <select id="catalogDept" class="form-select form-select-sm" required>
                  <option value="Pathology">Pathology</option>
                  <option value="Radiology">Radiology</option>
                  <option value="Cardiology">Cardiology</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small mb-0">Category *</label>
                <input type="text" id="catalogCategory" class="form-control form-control-sm" placeholder="e.g. Hematology / MRI" required />
              </div>
              <div class="col-md-4">
                <label class="form-label small mb-0">Price (BDT) *</label>
                <input type="number" id="catalogPrice" class="form-control form-control-sm" min="0" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small mb-0">Sample Type</label>
                <input type="text" id="catalogSampleType" class="form-control form-control-sm" placeholder="e.g. EDTA Blood, Serum, N/A" />
              </div>
              <div class="col-md-6">
                <label class="form-label small mb-0">Specimen Container</label>
                <input type="text" id="catalogContainer" class="form-control form-control-sm" placeholder="e.g. Purple Top Tube" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save Diagnostic Test</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/diagnosticTests.js"></script>
</body>
</html>
