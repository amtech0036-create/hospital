<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Inventory ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="reportAlert" class="alert alert-danger d-none"></div>

    <div class="stat-card mb-3">
      <div class="d-flex justify-content-between align-items-end flex-wrap gap-3">
        <div>
          <h6 class="mb-2">Business Reports</h6>
          <div class="row g-2 align-items-end">
            <div class="col-auto">
              <label class="form-label small mb-0">From</label>
              <input type="date" class="form-control form-control-sm" id="reportDateFrom" />
            </div>
            <div class="col-auto">
              <label class="form-label small mb-0">To</label>
              <input type="date" class="form-control form-control-sm" id="reportDateTo" />
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-sm btn-primary" id="reportRunBtn">Generate Report</button>
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="reportDateClear">This Month</button>
            </div>
          </div>
        </div>
        <div class="text-muted small" id="reportRangeLabel"></div>
      </div>
    </div>

    <div class="row g-3" id="reportStatCards"></div>

    <div class="row g-3 mt-1">
      <div class="col-lg-8">
        <div class="stat-card">
          <h6 class="mb-3">Sales by Day</h6>
          <canvas id="salesByDayChart" height="90"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="stat-card">
          <h6 class="mb-3">Top Products</h6>
          <canvas id="topProductsChart" height="90"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-lg-6">
        <div class="stat-card">
          <h6 class="mb-3">Expenses by Category</h6>
          <div id="expensesByCategoryBody"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="stat-card">
          <h6 class="mb-3">Daily Sales Detail</h6>
          <div id="salesByDayBody"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/companySettings.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
