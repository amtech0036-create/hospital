<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centralized EMR Timeline — HIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    .timeline { position: relative; border-left: 2px solid #0d6efd; margin-left: 20px; padding-left: 20px; }
    .timeline-item { position: relative; margin-bottom: 25px; }
    .timeline-icon { position: absolute; left: -31px; top: 0; background: #0d6efd; color: white; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; font-size: 11px; }
  </style>
</head>
<body>
  <div id="erpSidebar" class="erp-sidebar"></div>

  <div class="erp-content">
    <div id="erpTopbar"></div>
    <div id="emrAlert" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body py-3">
        <div class="row align-items-center g-2">
          <div class="col-md-5">
            <h5 class="mb-0 fw-bold"><i class="bi bi-clock-history text-primary me-2"></i>360° EMR Clinical Timeline</h5>
            <p class="text-muted small mb-0">Unified medical records across Emergency, OPD, Nursing, Lab, Radiology & Billing.</p>
          </div>
          <div class="col-md-7" id="emrPatientSearchContainer">
            <!-- Search-First Component injected here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Patient Profile Header -->
    <div id="patientProfileCard" class="card shadow-sm border-0 mb-3 d-none">
      <div class="card-body bg-light">
        <div class="row align-items-center">
          <div class="col-md-2 text-center">
            <i class="bi bi-person-bounding-box display-4 text-primary"></i>
          </div>
          <div class="col-md-10">
            <h4 id="emrPatientName" class="mb-1 fw-bold">Patient Name</h4>
            <div class="row g-2 small text-muted">
              <div class="col-md-3"><strong>UHID:</strong> <span id="emrUhidText">-</span></div>
              <div class="col-md-3"><strong>Gender/Age:</strong> <span id="emrAgeText">-</span></div>
              <div class="col-md-3"><strong>Mobile:</strong> <span id="emrPhoneText">-</span></div>
              <div class="col-md-3"><strong>Blood Group:</strong> <span id="emrBloodGroupText">-</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- EMR Timeline Feed -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3">
        <h6 class="mb-0 fw-bold"><i class="bi bi-journal-medical me-2 text-primary"></i>Chronological Clinical Event Feed</h6>
      </div>
      <div class="card-body">
        <div id="emrTimelineContainer" class="timeline">
          <div class="text-center text-muted py-4">Search patient by UHID or Name above to view 360-degree EMR history.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/components/searchComponent.js"></script>
  <script src="js/emr.js"></script>
</body>
</html>
