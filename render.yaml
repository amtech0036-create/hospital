# Render Blueprint — free web service for testing
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: inventory-erp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: "*"
      # Set MONGODB_URI in the Render dashboard after deploy:
      # MONGODB_URI

